name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build site
        run: |
          mkdir _site
          git ls-files | grep -vE '^(\.|docs/|README|CLAUDE)' | grep -v '/\.' | xargs -I{} cp --parents {} _site/
          # Screenshots are referenced by the manifest
          cp --parents docs/screenshots/*.jpg _site/
          node .github/gen-sw.js _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
