<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mafia Life</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="preload" href="fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c080b">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* Self-hosted fonts (latin subset), no third-party requests */
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-400.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-600.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-700.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-style:normal;font-weight:700 800;font-display:swap;src:url(fonts/playfair-display.woff2) format('woff2')}
:root{
  color-scheme: dark;
  --bg:#2b0d11; --deep:#1c080b; --panel:#3a141a; --panel2:#45181f; --line:#5b2a32; --ink:#f2e8d5; --mute:#b99f90;
  --brass:#d6ad52; --ok:#93c46d; --bad:#ee6e5a;
  --en:#5fb0d6; --wl:#b88ae0; --st:#e8a33d; --hp:#e2604f; --xp:#93c46d;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
/* Per-city palettes, set via <html data-city> */
:root[data-city="1"]{--bg:#121a22;--deep:#0b1016;--panel:#1b2631;--panel2:#22303d;--line:#34485a;--ink:#e6ecf0;--mute:#93a6b5;--brass:#c9b37a}
:root[data-city="2"]{--bg:#1d0d2b;--deep:#12071c;--panel:#2a1340;--panel2:#341850;--line:#55306f;--ink:#f6e9ff;--mute:#b79cc9;--brass:#ff5fb4}
:root[data-city="3"]{--bg:#0c2626;--deep:#071a1a;--panel:#123636;--panel2:#174242;--line:#2b6060;--ink:#f4ecd8;--mute:#9fbfb5;--brass:#f08a5d}
:root[data-city="4"]{--bg:#26210f;--deep:#1a1609;--panel:#352e16;--panel2:#40381b;--line:#5d522c;--ink:#f3ead0;--mute:#bcae86;--brass:#e0b341}
body{transition:background-color .4s}
/* ---------- Base ---------- */
:root{--en:#6f9fb8;--wl:#9a86c4;--st:#c9954a;--hp:#c0614f;--xp:#8fae6b;--hair:color-mix(in srgb,var(--ink) 9%,transparent);--gold:color-mix(in srgb,var(--brass) 85%,var(--ink))}
body{margin:0;color:var(--ink);font:16px/1.5 "Barlow",system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);background-color:var(--deep);
  background-image:radial-gradient(ellipse 90% 60% at 50% -10%,color-mix(in srgb,var(--bg) 100%,#fff 4%) 0%,var(--bg) 35%,var(--deep) 100%);background-attachment:fixed}
button{font:inherit;color:inherit}
::selection{background:var(--brass);color:var(--deep)}
.shell{max-width:1040px;margin:0 auto;padding:0 16px 120px}
aside{position:sticky;top:0;z-index:4;background:color-mix(in srgb,var(--deep) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  margin:0 -16px;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 10px;border-bottom:1px solid var(--hair)}
aside>*{max-width:560px;margin-left:auto;margin-right:auto}
.hud{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand img{width:30px;height:30px;border-radius:3px;display:block;transition:filter .4s,box-shadow .4s}
.logo{position:relative;flex-shrink:0;z-index:1}
.brand{position:relative;overflow:hidden;border-radius:4px;border:1px solid var(--hair);padding:6px 10px;min-height:44px;flex-wrap:wrap}
.brand .scene{position:absolute;inset:0;width:100%;height:100%;z-index:0;shape-rendering:crispEdges;image-rendering:pixelated;opacity:.85}
.brand h1{position:relative;z-index:1}
.scene .tw{animation:tw 2.4s steps(2) infinite}.scene .bl{animation:tw .9s steps(2) infinite}.scene .bl2{animation:tw .9s steps(2) infinite .45s}
.scene .beam{animation:beam 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}@keyframes beam{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.scene *{animation:none!important}}
/* Per-city logo + title styling */
.brand img{width:34px;height:34px}
:root[data-city="0"] .brand img{box-shadow:0 0 0 2px #5fb39a,3px 3px 0 2px #000}
:root[data-city="0"] .brand h1{color:#fff;text-shadow:2px 2px 0 #1c3060,3px 3px 0 #000}
:root[data-city="1"] .brand img{filter:sepia(.7) contrast(1.15);box-shadow:0 0 0 2px #c9b37a,3px 3px 0 2px #000}
:root[data-city="1"] .brand h1{color:#f3e2b8;text-shadow:2px 2px 0 #5a3d26,3px 3px 0 #000;letter-spacing:3px}
:root[data-city="2"] .brand img{filter:saturate(1.7);box-shadow:0 0 0 2px #ff5fb4,0 0 12px 2px #ff5fb4}
:root[data-city="2"] .brand h1{color:#fff;text-shadow:0 0 4px #ff5fb4,0 0 10px #ff5fb4,0 0 18px #ff2d95;animation:neon 4s infinite}
@keyframes neon{0%,92%,96%,100%{opacity:1}94%{opacity:.4}}
:root[data-city="3"] .brand img{filter:sepia(.3) hue-rotate(-15deg) saturate(1.4);box-shadow:0 0 0 2px #fff4d6,0 0 0 4px #f08a5d}
:root[data-city="3"] .brand h1{color:#fff4d6;text-shadow:2px 2px 0 #f08a5d,4px 4px 0 #1f6f8b}
:root[data-city="4"] .brand img{filter:sepia(.55) saturate(1.2);border-radius:50%;box-shadow:0 0 0 2px #e0b341,0 0 0 4px #6b2a1a}
:root[data-city="4"] .brand h1{color:#fff1c2;text-shadow:2px 2px 0 #8a3a1e,3px 3px 0 #000;font-style:italic}
.brand h1{display:none;font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:22px;margin:0;letter-spacing:.04em;color:var(--ink);text-shadow:0 1px 2px rgba(0,0,0,.7)}
@media (max-width:859px){.brand{flex-basis:100%}.brand h1{display:block;font-size:18px}}
.where{display:none;color:var(--mute);font-size:13px;margin:8px 2px 12px;font-style:italic}
.money{display:flex;flex:1;gap:16px;min-width:0;justify-content:space-between}
.money div{min-width:0}
.money small{display:block;font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;line-height:1.2}
.money span{font-weight:600;font-size:17px;white-space:nowrap;display:block;font-variant-numeric:tabular-nums}
.money .bnk{display:none}
.money .cry span{color:var(--wl)}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:8px}
.bar{font-size:11.5px;color:var(--mute);min-width:0}
.bar .lab{display:flex;justify-content:space-between;gap:3px;white-space:nowrap}
.bar .lab>span{min-width:0;display:flex}
.bar .lab b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.bar .nm{overflow:hidden;text-overflow:ellipsis}
.track{height:3px;background:var(--hair);border-radius:2px;overflow:hidden;margin-top:4px}
.fill{height:100%;transition:width .3s;border-radius:2px}
@media (prefers-reduced-motion:reduce){.fill,#msg{transition:none}}
.pill{display:inline-block;padding:1px 8px;border-radius:3px;font-size:12px;font-weight:600;background:var(--bad);color:#fff;margin-left:6px}
.side{display:none}
#msg{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;z-index:6;
  padding:12px 16px;background:color-mix(in srgb,var(--deep) 94%,#fff);border:1px solid var(--hair);border-left:3px solid var(--brass);border-radius:4px;font-size:15px;
  box-shadow:0 12px 32px rgba(0,0,0,.55);opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s}
#msg.show{opacity:1;transform:none;pointer-events:auto}
#msg.ok{border-left-color:var(--ok)} #msg.bad{border-left-color:var(--bad)}
h2{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:28px;line-height:1.15;margin:24px 0 4px;letter-spacing:.01em}
h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--gold);margin:0 0 10px}
.hint{color:var(--mute);font-size:14px;margin:0 0 8px}
.back{background:none;border:0;color:var(--mute);padding:10px 0 0;cursor:pointer;font-size:13px;font-weight:600;letter-spacing:.04em}
.back:hover{color:var(--brass)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--hair)}
.row .t{font-weight:600;font-size:16px;line-height:1.3}
.row .d{color:var(--mute);font-size:13.5px;margin-top:2px}
.row>div:first-child{min-width:0}
.row .d{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.costs{display:inline-flex;gap:12px;flex-wrap:wrap}
.cost{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.5}
.ic{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em}
.ic-en{color:var(--en)}.ic-wl{color:var(--wl)}.ic-st{color:var(--st)}.ic-hp{color:var(--hp)}.ic-xp{color:var(--xp)}
.bar .lab .ic{margin-right:4px;font-size:15px;align-self:center}
.cost .ic{font-size:15px}
.tile .i{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:1px solid var(--hair);color:var(--gold);font-size:18px;flex:none}
.tile:hover .i{border-color:color-mix(in srgb,var(--brass) 50%,transparent)}
nav.bottom button .i{font-size:21px;height:26px;display:flex;justify-content:center;align-items:center;opacity:.7;transition:opacity .15s}
nav.bottom button[aria-current="true"] .i{opacity:1}
.alert>.ic{font-size:18px;color:var(--ink);margin-right:-2px}
.alert>span{flex:1}
.row .t .ic{margin-right:6px}
.cost.short{color:color-mix(in srgb,var(--bad) 55%,#f4a3c4);text-decoration:underline dotted;text-decoration-thickness:1.5px;text-underline-offset:3px}
.row.locked .costs{opacity:.5}

.row.locked .t,.row.locked .d{opacity:.5}
.row .acts{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.row .btnw{display:flex;gap:6px}
.acts .costs{gap:10px;justify-content:flex-end}
.acts .cost{font-size:12.5px;color:var(--mute)}
.acts .cost.short{color:color-mix(in srgb,var(--bad) 55%,#f4a3c4);text-decoration:none}
.btn.miss,.btn.miss:disabled{display:inline-flex;align-items:center;justify-content:center;gap:5px;text-transform:none;letter-spacing:.02em;font-weight:600;
  color:color-mix(in srgb,var(--bad) 55%,#f4a3c4);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.btn.miss .ic{font-size:14px}
.btn{background:var(--brass);color:#16110a;border:1px solid transparent;border-radius:4px;padding:10px 16px;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
  min-width:96px;min-height:42px;cursor:pointer;transition:background .15s,filter .15s,transform .05s}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.sm{min-width:60px;padding:10px}
.btn:disabled{background:transparent;color:color-mix(in srgb,var(--mute) 70%,transparent);border-color:var(--hair);cursor:not-allowed}
.btn.alt{background:transparent;color:var(--gold);border-color:color-mix(in srgb,var(--brass) 55%,transparent)}
.btn.alt:hover:not(:disabled){background:color-mix(in srgb,var(--brass) 10%,transparent);filter:none}
.btn.alt:disabled{border-color:var(--hair);color:color-mix(in srgb,var(--mute) 70%,transparent)}
.btn:disabled:has([data-cd]){display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);border-color:color-mix(in srgb,var(--ink) 18%,transparent);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.btn .ic-clock{font-size:15px;opacity:.7}
.btn.on{background:var(--ink);color:var(--deep);border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.card{background:color-mix(in srgb,var(--panel) 55%,transparent);border:1px solid var(--hair);border-radius:6px;padding:16px;margin:14px 0}
.alert{display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:6px;padding:12px 14px;margin:10px 0;
  background:color-mix(in srgb,var(--bad) 10%,transparent);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.alert.info{background:color-mix(in srgb,var(--wl) 10%,transparent);border-color:color-mix(in srgb,var(--wl) 40%,transparent)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hair);border-radius:4px;overflow:hidden}
.sgrid div{padding:10px 12px;background:color-mix(in srgb,var(--panel) 92%,var(--deep))}
.sgrid small{display:block;color:var(--mute);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.sgrid b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.sgrid .tot b{color:var(--gold)}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--hair);font-variant-numeric:tabular-nums}
.stat span{flex:none}
.stat:last-child{border-bottom:0}
.stat b{font-weight:600;text-align:right;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.tile{background:color-mix(in srgb,var(--panel) 55%,transparent);border:1px solid var(--hair);border-radius:6px;padding:12px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;min-width:0;transition:border-color .15s,background .15s}
.tile:hover{border-color:color-mix(in srgb,var(--brass) 50%,transparent);background:var(--panel)}
.tile span:last-child{min-width:0}
.tile b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{display:block;color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reels{font-size:40px;letter-spacing:10px;text-align:center;background:#0006;border:1px solid var(--hair);border-radius:6px;padding:14px;margin:10px 0}
.evh{color:var(--mute);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;margin:18px 0 4px}
.evh:first-child{margin-top:6px}
.ev{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--hair);font-size:14.5px;line-height:1.4}
.ev i{flex:none;width:7px;height:7px;border-radius:50%;font-size:0;background:var(--brass);transform:translateY(-2px)}
.ev.ok i{background:var(--ok)} .ev.bad i{background:var(--bad)}
.ev b{color:var(--ink);font-weight:600} .ev p{margin:0;color:var(--mute)}
.ev em{font-style:normal;font-weight:600;color:var(--gold)} .ev.ok em{color:var(--ok)} .ev.bad em{color:var(--bad)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--deep) 94%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-top:1px solid var(--hair);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.bottom .in{display:flex;width:100%;max-width:560px}
nav.bottom button{flex:1;background:none;border:0;color:var(--mute);padding:9px 2px 10px;font-weight:600;font-size:11.5px;letter-spacing:.03em;cursor:pointer;position:relative}
nav.bottom button[aria-current="true"]{color:var(--gold)}
nav.bottom button[aria-current="true"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--brass);border-radius:0 0 2px 2px}
main{max-width:560px;margin:0 auto}
/* News tick: singular unlocks not yet seen */
.new{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--ok);color:#0f1a08;font-size:11px;font-weight:800;line-height:1;flex:none}
nav.bottom button .new{position:absolute;top:5px;left:calc(50% + 8px)}
.tile{position:relative}.tile .new{position:absolute;top:6px;right:6px}
.tag{display:inline-block;margin-left:8px;padding:0 6px;border-radius:3px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--ok);color:#0f1a08;vertical-align:2px}
/* Home */
.hero{position:relative;overflow:hidden;border:1px solid var(--hair);border-radius:8px;padding:18px 16px 16px;margin:16px 0 14px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--brass) 16%,var(--panel)) 0%,color-mix(in srgb,var(--panel) 60%,transparent) 70%)}
.hero h2{margin:2px 0 2px;font-size:30px}
.hero .eyb{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.hero .hhd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero .lvl{flex:none;margin-top:-4px;text-align:center;font-family:"Playfair Display",Georgia,serif;font-size:34px;line-height:1;color:var(--gold)}
.hero .lvl small{display:block;font:600 10px "Barlow",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.xpbar{height:8px;border-radius:4px;background:var(--hair);overflow:hidden;margin:12px 0 6px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--xp),color-mix(in srgb,var(--xp) 60%,#fff));border-radius:4px;transition:width .4s}
.hero p{margin:0;font-size:13px;color:var(--mute)}
.todo{display:grid;gap:8px;margin:0 0 14px}
.act{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;padding:12px 14px;border-radius:8px;border:1px solid var(--hair);
  background:color-mix(in srgb,var(--panel) 55%,transparent);transition:border-color .15s,background .15s,transform .08s}
.act:hover:not(:disabled){border-color:color-mix(in srgb,var(--brass) 55%,transparent);background:var(--panel)}
.act:active:not(:disabled){transform:scale(.99)}
.act:disabled{opacity:.5;cursor:not-allowed}
.act .i{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--brass) 14%,transparent);color:var(--gold);font-size:19px;flex:none}
.act>span:nth-child(2){flex:1;min-width:0}
.act b{display:block;font-weight:600;font-size:15px}
.act small{display:block;color:var(--mute);font-size:12.5px}
.act .go{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);flex:none}
.act.hot{border-color:color-mix(in srgb,var(--ok) 55%,transparent);background:color-mix(in srgb,var(--ok) 9%,transparent)}
.act.hot .i{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
@media (prefers-reduced-motion:no-preference){.act.hot .i{animation:pulse 2s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--ok) 0%,transparent),0 0 0 3px color-mix(in srgb,var(--ok) 30%,transparent)}}
@media (min-width:860px){
  .shell{display:grid;grid-template-columns:240px 1fr;gap:40px;padding-bottom:40px}
  aside{top:0;align-self:start;max-height:100vh;overflow:auto;margin:0;padding:20px 0;border:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  aside>*{max-width:none}
  .hud{display:block}
  .brand{padding:10px 12px;min-height:64px}
  .brand h1{display:block;font-size:20px;white-space:nowrap}
  .where{display:block}
  .money{display:grid;grid-template-columns:1fr 1fr;gap:12px 8px}
  .money .bnk{display:block}
  .bars{grid-template-columns:1fr;margin-top:16px;gap:10px}
  .bar{font-size:12px}
  .side{display:block;border-top:1px solid var(--hair);padding-top:12px;margin-top:16px}
  .side button{display:flex;justify-content:space-between;width:100%;background:none;border:0;border-radius:4px;padding:8px 12px;text-align:left;color:var(--mute);cursor:pointer;font-size:15px;transition:background .15s,color .15s}
  .side button:hover{color:var(--ink);background:var(--hair)}
  .side button{align-items:center}
  .side button[aria-current="true"]{color:var(--ink);background:var(--hair);box-shadow:inset 2px 0 0 var(--brass);font-weight:600}
  nav.bottom{display:none}
  main{margin:0;padding-top:12px}
  #msg{bottom:24px;left:296px}
}
</style>
</head>
<body>
<div class="shell">

function desc(d){const txt=[],chips=[],miss=[];String(d).split(' · ').forEach(p=>{let m=p.match(/^(⚡|✊|💪)(\d+)$/);
  if(m){const[k,,n]=COST[m[1]],need=+m[2],sh=S[k]<need;if(sh)miss.push(ic(k)+Math.ceil(need-S[k]));
    chips.push('<span class="cost'+(sh?' short':'')+'" title="'+n+'" aria-label="'+n+' '+need+'">'+ic(k)+need+'</span>');return}
  m=p.match(/^(cuota |billete )?\$([\d.]+)$/);
  if(m){const need=+m[2].replace(/\./g,''),sh=S.cash<need;if(sh)miss.push(fmt(need-S.cash));
    chips.push('<span class="cost cash'+(sh?' short':'')+'">'+p.replace(/^(cuota|billete) /,'')+'</span>');return}
  txt.push(p)});
  return {txt:txt.join(' · '),chips:chips.length?'<span class="costs">'+chips.join('')+'</span>':'',miss}}

document.addEventListener('click',e=>{
  if(e.target.id==='msg'){e.target.classList.remove('show');return}
  const t=e.target.closest('[data-tab]');if(t){if(t.dataset.tab!==tab)history.pushState(null,'','#'+t.dataset.tab);tab=t.dataset.tab;view();window.scrollTo(0,0);return}
  const bt=e.target.closest('button[data-a]');if(!bt||bt.disabled)return;
  const a=bt.dataset.a,i=bt.dataset.i;
  if(asleep()&&!['wake','bet','exp','imp','reset'].includes(a)){msg('Estás durmiendo. Despierta primero.','info',0);return}
  if(locked()&&STREET.has(a)){msg('No puedes hacer eso mientras estás en '+where()+'.','info',0);return}
  if(a==='buy'){const p=i.split('|');ACT.buy(p[0],+p[1])}
  else if(a==='train'){const p=i.split('|');ACT.train(p[0])}
  else if(a==='out'){const p=i.split('|');ACT.out(p[0],p[1])}
  else ACT[a](i);
  save();view()});

document.body.appendChild(impf);
impf.addEventListener('change',async()=>{const f=impf.files[0];impf.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(!d||typeof d!=='object'||typeof d.lvl!=='number')throw 0;
    if(!confirm('¿Sustituir la partida actual por la importada (nivel '+d.lvl+')?'))return;
    S=migrate(d);S.t=now();msg('Partida importada.','ok',0)}
  catch(e){msg('El fichero no es una partida válida.','bad',0)}
  save();view()});

// Achievements: one-off XP (a share of the current level's requirement). Ids are saved: only append.
const ACH=[['m1','Tu primer millón',()=>S.cash+S.bank>=1e6],['w10','10 peleas ganadas',()=>S.wins>=10],['w50','50 peleas ganadas',()=>S.wins>=50],
 ['w100','100 peleas ganadas',()=>S.wins>=100],['v1','Tu primer vehículo',()=>S.veh.length>0],['g10','Banda de 10 miembros',()=>S.g>=10]];
function achCheck(){for(const[id,n,ok]of ACH)if(!S.ach.includes(id)&&ok()){S.ach.push(id);const x=Math.ceil(need()*.25);msg('Logro: '+n+'. +'+x+' XP.','ok');gain(x)}}
function tick(dt){achCheck();
  S.en=Math.min(maxEn(),S.en+dt/20);S.st=Math.min(maxSt(),S.st+dt/40);S.hp=Math.min(maxHp(),S.hp+dt/60);S.wl=Math.min(maxWl(),S.wl+dt/45);S.terr=Math.max(0,S.terr-dt/120);
  const n0=now(),sd=S.sleep?Math.max(0,(Math.min(n0,S.sleep)-(n0-dt*1000))/1000):0;
  if(sd){S.en=Math.min(maxEn(),S.en+sd*(SLEEP_X-1)/20);S.hp=Math.min(maxHp(),S.hp+sd*(SLEEP_X-1)/60)}
  if(S.sleep&&n0>=S.sleep){S.sleep=0;msg('Te despiertas descansado.','ok')}
  S.cash+=income()*dt/60;if(S.job>=0&&!inJail()&&!inHosp())S.lab+=dt/60*(.06+S.job*.02);
  const n=now();
  if(S.hosp&&n>=S.hosp){S.hosp=0;S.hp=Math.max(S.hp,maxHp()*.5);msg('Te dan el alta en el hospital.','info')}
  if(S.term&&n>=S.term.end){const t=TERMS[S.term.i],g=Math.floor(S.term.a*(1+t.r));S.bank+=g;S.term=null;msg('Vence tu '+t.n.toLowerCase()+': recibes '+fmt(g)+' en el banco y '+S.lvl+' XP.','ok');gain(S.lvl)}
  if(S.fund&&n>=S.fund.end){const f=FUNDS[S.fund.i],g=Math.floor(S.fund.a*(1+f.lo+Math.random()*(f.hi-f.lo)));S.bank+=g;msg(f.n+': recuperas '+fmt(g)+' en el banco ('+(g>=S.fund.a?'ganas ':'pierdes ')+fmt(Math.abs(g-S.fund.a))+').',g>=S.fund.a?'ok':'bad');S.fund=null;gain(S.lvl)}
  if(S.loan&&n>=S.loan.end){const L=S.loan,v=(L.v||0)+1,fromCash=Math.min(Math.floor(S.cash),L.a),fromBank=Math.min(Math.floor(S.bank),L.a-fromCash),left=L.a-fromCash-fromBank,d=hd(20*v);
    S.cash-=fromCash;S.bank-=fromBank;S.hp=Math.max(1,S.hp-d);
    if(left>0){S.loan={a:Math.ceil(left*(1+LOAN_R)),end:L.end+LOAN_MIN*60000,v};msg('Los cobradores te visitan: se llevan '+fmt(fromCash+fromBank)+' y pierdes '+d+' de salud. Aún debes '+fmt(S.loan.a)+'.','bad')}
    else{S.loan=null;msg('Los cobradores te visitan: se llevan '+fmt(fromCash+fromBank)+' y pierdes '+d+' de salud. Deuda saldada.','bad')}}
  if(S.jail&&n>=S.jail){S.jail=0;msg('Sales de la cárcel tras cumplir condena: +'+S.lvl+' XP.','info');gain(S.lvl)}
  if(S.edu&&n>=S.edu.end){const c=COURSES[S.edu.i];S.iq+=c.iq;if(c.lab)S.lab+=c.lab;S.done.push(S.edu.i);S.edu=null;S.cry++;const x=Math.ceil(c.min/3);msg('Terminas «'+c.n+'»: ganas 1 gema y '+x+' XP.','ok');gain(x)}}
const now0=now();tick(Math.min(21600,(now0-S.t)/1000));S.t=now0;
let sig='',beat=0;
setInterval(()=>{const n=now();tick((n-S.t)/1000);S.t=n;head();beat++;
  const s=[!!S.term,!!S.fund,!!S.loan,Math.floor(S.en),Math.floor(S.st),Math.floor(S.hp),Math.floor(S.wl/2),inHosp(),inJail(),!!S.edu,S.fear>now(),S.cool.gym>now(),asleep(),S.cool.sleep>now(),Object.keys(S.crc).filter(crOn).length,income()&&beat%10===0?beat:0].join('|');
  if(s!==sig){sig=s;view()}},1000);
setInterval(save,5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
view();save();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
