<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mafia Life</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c080b">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#2b0d11; --deep:#1c080b; --panel:#3a141a; --panel2:#45181f; --line:#5b2a32; --ink:#f2e8d5; --mute:#b99f90;
  --brass:#d6ad52; --ok:#93c46d; --bad:#ee6e5a;
  --en:#5fb0d6; --wl:#b88ae0; --st:#e2604f; --hp:#e8a33d; --xp:#93c46d;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
/* Per-city palettes, set via <html data-city> */
:root[data-city="1"]{--bg:#121a22;--deep:#0b1016;--panel:#1b2631;--panel2:#22303d;--line:#34485a;--ink:#e6ecf0;--mute:#93a6b5;--brass:#c9b37a}
:root[data-city="2"]{--bg:#1d0d2b;--deep:#12071c;--panel:#2a1340;--panel2:#341850;--line:#55306f;--ink:#f6e9ff;--mute:#b79cc9;--brass:#ff5fb4}
:root[data-city="3"]{--bg:#0c2626;--deep:#071a1a;--panel:#123636;--panel2:#174242;--line:#2b6060;--ink:#f4ecd8;--mute:#9fbfb5;--brass:#f08a5d}
:root[data-city="4"]{--bg:#26210f;--deep:#1a1609;--panel:#352e16;--panel2:#40381b;--line:#5d522c;--ink:#f3ead0;--mute:#bcae86;--brass:#e0b341}
body{transition:background-color .4s}

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Barlow",system-ui,sans-serif;min-height:100vh;
  padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit}
.shell{max-width:1040px;margin:0 auto;padding:0 12px 120px}
/* Mobile: compact sticky HUD (money + bars always visible) */
aside{position:sticky;top:0;z-index:4;background:var(--bg);margin:0 -12px;padding:calc(env(safe-area-inset-top,0px) + 6px) 12px 6px;border-bottom:1px solid var(--line);box-shadow:0 4px 10px rgba(0,0,0,.35)}
.hud{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand img{width:30px;height:30px;border-radius:6px;display:block;transition:filter .4s,box-shadow .4s}
.logo{position:relative;flex-shrink:0;z-index:1}
/* City scene banner behind the brand */
.brand{position:relative;overflow:hidden;border-radius:8px;border:1px solid var(--line);padding:6px 10px;min-height:44px;flex-wrap:wrap}
.brand .scene{position:absolute;inset:0;width:100%;height:100%;z-index:0;shape-rendering:crispEdges;image-rendering:pixelated}
.brand h1{position:relative;z-index:1}
.scene .tw{animation:tw 2.4s steps(2) infinite}.scene .bl{animation:tw .9s steps(2) infinite}.scene .bl2{animation:tw .9s steps(2) infinite .45s}
.scene .beam{animation:beam 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}@keyframes beam{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.scene *{animation:none!important}}
/* Per-city logo + title styling */
.brand img{width:34px;height:34px}
:root[data-city="0"] .brand img{box-shadow:0 0 0 2px #5fb39a,3px 3px 0 2px #000}
:root[data-city="0"] .brand h1{color:#fff;text-shadow:2px 2px 0 #1c3060,3px 3px 0 #000}
:root[data-city="1"] .brand img{filter:sepia(.7) contrast(1.15);box-shadow:0 0 0 2px #c9b37a,3px 3px 0 2px #000}
:root[data-city="1"] .brand h1{color:#f3e2b8;text-shadow:2px 2px 0 #5a3d26,3px 3px 0 #000;letter-spacing:3px}
:root[data-city="2"] .brand img{filter:saturate(1.7);box-shadow:0 0 0 2px #ff5fb4,0 0 12px 2px #ff5fb4}
:root[data-city="2"] .brand h1{color:#fff;text-shadow:0 0 4px #ff5fb4,0 0 10px #ff5fb4,0 0 18px #ff2d95;animation:neon 4s infinite}
@keyframes neon{0%,92%,96%,100%{opacity:1}94%{opacity:.4}}
:root[data-city="3"] .brand img{filter:sepia(.3) hue-rotate(-15deg) saturate(1.4);box-shadow:0 0 0 2px #fff4d6,0 0 0 4px #f08a5d}
:root[data-city="3"] .brand h1{color:#fff4d6;text-shadow:2px 2px 0 #f08a5d,4px 4px 0 #1f6f8b}
:root[data-city="4"] .brand img{filter:sepia(.55) saturate(1.2);border-radius:50%;box-shadow:0 0 0 2px #e0b341,0 0 0 4px #6b2a1a}
:root[data-city="4"] .brand h1{color:#fff1c2;text-shadow:2px 2px 0 #8a3a1e,3px 3px 0 #000;font-style:italic}
.brand h1{display:none;font-family:"Alfa Slab One",Georgia,serif;font-weight:400;font-size:24px;margin:0;letter-spacing:2px;text-transform:uppercase;color:var(--ink);text-shadow:2px 2px 0 #000}
@media (max-width:859px){.brand{flex-basis:100%}.brand h1{display:block;font-size:18px;letter-spacing:1px}}
.where{display:none;color:var(--mute);font-size:13px;margin:0 2px 8px}
.money{display:flex;flex:1;gap:12px;min-width:0;justify-content:space-between}
.money div{min-width:0}
.money small{display:block;font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;line-height:1.1}
.money span{font-weight:700;font-size:16px;white-space:nowrap;display:block}
.money .bnk{display:none}
.money .cry span{color:var(--wl)}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:6px}
.bar{font-size:10.5px;color:var(--mute);min-width:0}
.bar .lab{display:flex;justify-content:space-between;gap:3px;white-space:nowrap}
.bar .lab>span{min-width:0;display:flex}
.bar .lab b{color:var(--ink);font-weight:600}
.bar .nm{overflow:hidden;text-overflow:ellipsis}
.track{height:6px;background:var(--deep);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-top:2px}
.fill{height:100%;transition:width .3s}
@media (prefers-reduced-motion:reduce){.fill,#msg{transition:none}}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--bad);color:var(--deep);margin-left:4px}
.side{display:none}
/* Feedback toast: always visible right above the bottom nav */
#msg{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;z-index:6;
  padding:10px 12px;border-left:4px solid var(--brass);background:var(--panel2);border-radius:6px;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.5);
  opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s}
#msg.show{opacity:1;transform:none;pointer-events:auto}
#msg.ok{border-color:var(--ok)} #msg.bad{border-color:var(--bad)}
h2{font-family:"Alfa Slab One",Georgia,serif;font-weight:400;font-size:20px;margin:16px 0 4px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--brass);margin:0 0 8px}
.hint{color:var(--mute);font-size:13px;margin:0 0 4px}
.back{background:none;border:0;color:var(--brass);padding:8px 0;cursor:pointer;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .t{font-weight:600;font-size:16px;line-height:1.25}
.row .d{color:var(--mute);font-size:13px}
.row>div:first-child{min-width:0}
.row.locked{opacity:.5}
.row .acts{display:flex;gap:6px;flex-shrink:0}
.btn{background:var(--brass);color:var(--deep);border:0;border-radius:6px;padding:10px 14px;font-weight:700;font-size:15px;min-width:84px;min-height:44px;cursor:pointer}
.btn.sm{min-width:60px;padding:10px}
.btn:disabled{background:var(--line);color:var(--mute);cursor:not-allowed}
.btn.alt{background:transparent;color:var(--brass);border:1px solid var(--brass)}
.btn.alt:disabled{border-color:var(--line);background:transparent}
.btn.on{background:var(--ink)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0}
.alert{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:8px;padding:10px 12px;margin:8px 0;background:var(--panel2);border:1px solid var(--bad)}
.alert.info{border-color:var(--wl)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.sgrid div{padding:8px 10px;border-bottom:1px solid var(--line)}
.sgrid div:nth-child(odd){border-right:1px solid var(--line)}
.sgrid small{display:block;color:var(--mute);font-size:12px}
.sgrid b{font-size:18px}
.sgrid .tot{background:var(--panel2)}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;min-width:0}
.tile:hover{border-color:var(--brass)}
.tile .i{font-size:18px;flex:none;opacity:.85}
.tile span:last-child{min-width:0}
.tile b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reels{font-size:40px;letter-spacing:8px;text-align:center;background:var(--deep);border:1px solid var(--line);border-radius:8px;padding:8px;margin:8px 0}
.evh{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:14px 0 6px}
.evh:first-child{margin-top:4px}
.ev{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;margin-bottom:4px;background:var(--panel);border-radius:8px;font-size:14px;line-height:1.35}
.ev i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;color:var(--deep);background:var(--brass);margin-top:1px}
.ev.ok i{background:var(--ok)} .ev.bad i{background:var(--bad)}
.ev b{color:var(--ink)} .ev p{margin:0;color:var(--mute)}
.ev em{font-style:normal;font-weight:600;color:var(--brass)} .ev.ok em{color:var(--ok)} .ev.bad em{color:var(--bad)}
/* Bottom nav (mobile) */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--deep);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.bottom .in{display:flex;width:100%;max-width:560px}
nav.bottom button{flex:1;background:none;border:0;color:var(--mute);padding:8px 2px 10px;font-weight:600;font-size:12px;cursor:pointer;border-top:3px solid transparent;position:relative}
nav.bottom button .i{display:block;font-size:20px;line-height:1.2}
nav.bottom button[aria-current="true"]{color:var(--brass);border-top-color:var(--brass)}
main{max-width:560px;margin:0 auto}
/* Desktop: original-style left column */
@media (min-width:860px){
  .shell{display:grid;grid-template-columns:250px 1fr;gap:24px;padding-bottom:30px}
  aside{top:0;align-self:start;max-height:100vh;overflow:auto;margin:0;padding:10px 0 20px;border:0;box-shadow:none}
  .hud{display:block}
  .brand{padding:10px 12px;min-height:64px;margin-bottom:8px}
  .brand h1{display:block;font-size:19px;letter-spacing:1px;white-space:nowrap}
  .where{display:block}
  .money{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .money div,.money .bnk{display:block;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
  .bars{grid-template-columns:1fr;margin-top:8px}
  .bar{font-size:12px}
  .side{display:block;border-top:1px solid var(--line);padding-top:6px;margin-top:8px}
  .side button{display:flex;justify-content:space-between;width:100%;background:none;border:0;border-radius:6px;padding:8px 10px;text-align:left;color:var(--ink);cursor:pointer}
  .side button:hover{background:var(--panel)}
  .side button[aria-current="true"]{background:var(--panel);color:var(--brass);font-weight:700}
  nav.bottom{display:none}
  main{margin:0;padding-top:10px}
  #msg{bottom:20px;left:298px}
}
</style>
</head>

 bet(v){bet=+v},
 slot(){if(locked()||S.cash<bet)return;const R=['🍒','🍋','🔔','💎','7️⃣'],X=[5,8,10,15,25],r=[0,0,0].map(()=>rnd(0,4));reels=r.map(x=>R[x]).join(' ');
  let w=0;if(r[0]===r[1]&&r[1]===r[2])w=bet*X[r[0]];else if(r[0]===r[1]||r[1]===r[2]||r[0]===r[2])w=bet;
  S.cash+=w-bet;msg(reels+' — '+(w>bet?'¡Premio! Ganas '+fmt(w-bet)+'.':w?'Recuperas tu apuesta.':'Pierdes '+fmt(bet)+'.'),w>bet?'ok':w?'info':'bad',w>bet*4?1:0)},
 roul(c){if(locked()||S.cash<bet)return;const n=rnd(0,36),col=n===0?'verde':REDS.includes(n)?'rojo':'negro',want={r:'rojo',n:'negro',z:'verde'}[c];

function row(t,d,btn,lock){return '<div class="row'+(lock?' locked':'')+'"><div><div class="t">'+t+'</div><div class="d">'+d+'</div></div><div class="acts">'+btn+'</div></div>'}
function b(act,arg,label,dis,cls){return '<button class="btn'+(cls?' '+cls:'')+'" data-a="'+act+'"'+(arg!==undefined?' data-i="'+arg+'"':'')+(dis?' disabled':'')+'>'+label+'</button>'}
const back=()=>'<button class="back" data-tab="explore">← Explorar</button>';
function status(){let h='';
  if(inHosp())h+='<div class="alert">🏥 <span>En el hospital: '+cd(S.hosp)+'</span>'+(tab!=='hosp'?'<button class="btn sm alt" data-tab="hosp">Ver</button>':'')+'</div>';
  if(inJail())h+='<div class="alert">🚔 <span>En la cárcel: '+cd(S.jail)+'</span>'+(tab!=='jail'?'<button class="btn sm alt" data-tab="jail">Ver</button>':'')+'</div>';
  return h}
function stake(){return '<div class="btns">'+[100,1000,10000,100000].map(v=>b('bet',v,fmt(v),S.cash<v,bet===v?'on sm':'alt sm')).join('')+'</div>'}
function rel(t){const s=(now()-t)/1000;return s<60?'ahora':s<3600?'hace '+Math.floor(s/60)+' min':s<86400?'hace '+Math.floor(s/3600)+' h':'hace '+Math.floor(s/86400)+' d'}
const EVI={ok:'✓',bad:'✕',info:'!'};
function evs(L){let g='';return L.map(e=>{const r=rel(e.t),h=r!==g?'<div class="evh">'+(g=r)+'</div>':'';
  let m=e.m.replace(/</g,'&lt;').replace(/(\$\d[\d.,]*\d|\$\d|[+-]?\d+ (?:XP|de \w+|puntos? de habilidad|gemas?|min))/g,'<em>$1</em>');
  m=m.replace(/^([^:.!]{3,40}):\s*/,'<b>$1</b> · ');
  return h+'<div class="ev '+e.k+'"><i>'+(EVI[e.k]||'•')+'</i><p>'+m+'</p></div>'}).join('')}

  return h}
};
const topTab=t=>NAV.some(n=>n[0]===t)?t:'explore';

function bars(){const L=[['Energía',S.en,maxEn(),'--en','⚡'],['Voluntad',S.wl,maxWl(),'--wl','✊'],['Valor',S.st,maxSt(),'--st','💪'],['Salud',S.hp,maxHp(),'--hp','❤️'],['XP',S.xp,need(),'--xp','⭐']];
  $('#bars').innerHTML=L.map(x=>'<div class="bar" title="'+x[0]+'"><div class="lab"><span>'+x[4]+'&nbsp;<span class="nm">'+x[0]+'</span></span><b aria-label="'+x[0]+'">'+Math.floor(x[1])+(innerWidth<860?'':'/'+x[2])+'</b></div><div class="track"><div class="fill" style="width:'+Math.max(0,Math.min(100,x[1]/x[2]*100))+'%;background:var('+x[3]+')"></div></div></div>').join('')}
function head(){const de=document.documentElement;if(de.dataset.city!=String(S.city)){de.dataset.city=S.city;drawScene()}const tc=getComputedStyle(document.documentElement).getPropertyValue('--deep').trim();document.querySelector('meta[name=theme-color]').content=tc;$('#where').innerHTML=rank()+' · '+city().n+(income()?' · +'+fmt(income())+'/min':'')+(inHosp()?'<span class="pill">Hospital</span>':'')+(inJail()?'<span class="pill">Cárcel</span>':'');
  $('#cash').textContent=fmt(S.cash);$('#bank').textContent=fmt(S.bank);$('#lvl').textContent=S.lvl;$('#cry').textContent=S.cry;bars();
  document.querySelectorAll('[data-cd]').forEach(e=>e.textContent=fmtT(+e.dataset.cd-now()))}
function view(){if(!S.foes.length)genFoes();$('#view').innerHTML=VIEWS[tab]();
  $('#nav').innerHTML=NAV.map(t=>'<button data-tab="'+t[0]+'"'+(t[0]===topTab(tab)?' aria-current="true"':'')+'><span class="i" aria-hidden="true">'+t[2]+'</span>'+t[1]+'</button>').join('');
  $('#side').innerHTML=MENU.map(t=>'<button data-tab="'+t[0]+'"'+(t[0]===tab?' aria-current="true"':'')+'><span>'+t[1]+'</span>'+(t[0]==='hosp'&&inHosp()||t[0]==='jail'&&inJail()?'<span class="pill">●</span>':'')+'</button>').join('');head()}

document.addEventListener('click',e=>{
  if(e.target.id==='msg'){e.target.classList.remove('show');return}
  const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;view();window.scrollTo(0,0);return}
  const bt=e.target.closest('button[data-a]');if(!bt||bt.disabled)return;
  const a=bt.dataset.a,i=bt.dataset.i;
  if(a==='buy'){const p=i.split('|');ACT.buy(p[0],+p[1])}
  else if(a==='train'){const p=i.split('|');ACT.train(p[0])}
  else if(a==='out'){const p=i.split('|');ACT.out(p[0],p[1])}
  else ACT[a](i);
  save();view()});

// Import: hidden file input, replaces the current game after confirmation
const impf=Object.assign(document.createElement('input'),{type:'file',accept:'.json,application/json',id:'impf',hidden:true});
document.body.appendChild(impf);
impf.addEventListener('change',async()=>{const f=impf.files[0];impf.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(!d||typeof d!=='object'||typeof d.lvl!=='number')throw 0;
    if(!confirm('¿Sustituir la partida actual por la importada (nivel '+d.lvl+')?'))return;
    S=migrate(d);S.t=now();msg('Partida importada.','ok',0)}
  catch(e){msg('El fichero no es una partida válida.','bad',0)}
  save();view()});

function tick(dt){
  S.en=Math.min(maxEn(),S.en+dt/25);S.st=Math.min(maxSt(),S.st+dt/40);S.hp=Math.min(maxHp(),S.hp+dt/12);S.wl=Math.min(maxWl(),S.wl+dt/9);S.terr=Math.max(0,S.terr-dt/120);
  S.cash+=income()*dt/60;if(S.job>=0&&!inJail())S.lab+=dt/60*(.3+S.job*.15);
  const n=now();
  if(S.hosp&&n>=S.hosp){S.hosp=0;S.hp=Math.max(S.hp,maxHp()*.5);msg('Te dan el alta en el hospital.','info')}
  if(S.jail&&n>=S.jail){S.jail=0;msg('Sales de la cárcel. Pórtate bien.','info')}
  if(S.edu&&n>=S.edu.end){const c=COURSES[S.edu.i];S.iq+=c.iq;if(c.lab)S.lab+=c.lab;S.done.push(S.edu.i);S.edu=null;S.cry++;msg('Terminas «'+c.n+'»: ganas 1 gema.','ok')}}
const now0=now();tick(Math.min(3600,(now0-S.t)/1000));S.t=now0;
let sig='',beat=0;
setInterval(()=>{const n=now();tick((n-S.t)/1000);S.t=n;head();beat++;
  const s=[Math.floor(S.en),Math.floor(S.st),Math.floor(S.hp),Math.floor(S.wl/10),inHosp(),inJail(),!!S.edu,S.fear>now(),STATS.filter(s=>S.cool[s[0]]>now()).length,income()&&beat%10===0?beat:0].join('|');
  if(s!==sig){sig=s;view()}},1000);
setInterval(save,5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
view();save();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
